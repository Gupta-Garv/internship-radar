name: 📡 24/7 Internship Radar Sweep

on:
  schedule:
    # Runs every 5 hours (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'dashboard/jobs_data.js'
      - 'jobs_data.js'
      - 'README.md'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Radar Harvester & Scorer
        run: |
          python radar_runner.py scan

      - name: Keep root index.html synchronized
        run: |
          cp dashboard/index.html index.html

      - name: Commit and push updated matches
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json data/latest_matches.json dashboard/jobs_data.js jobs_data.js index.html
          if git diff --staged --quiet; then
            echo "No new postings or changes to commit."
          else
            git commit -m "chore(radar): 24/7 cloud sweep update [skip ci]"
            git push
          fi
